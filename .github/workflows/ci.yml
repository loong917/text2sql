name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install uv==0.12.5
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest -q
        env:
          MSSQL_CONN_STR: "Driver={ODBC Driver 18 for SQL Server};Server=localhost;Database=test;UID=test;PWD=test"
      - run: uv run python -m compileall -q src tests scripts

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target server -t text2sql-server-ci .
      - run: docker build --target trainer -t text2sql-trainer-ci .
