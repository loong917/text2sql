[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[project]
name = "text2sql"
version = "0.8.1"
description = "Local Text2SQL with verified query plans and immutable knowledge artifacts"
readme = "README.MD"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Team" }]
dependencies = [
    "vanna[ollama,chromadb]>=2.0",
    "pyodbc>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.4",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "sqlglot>=27.0,<29.0",
    "packaging>=24.0,<27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
# Security floors for transitive HTTP/OAuth dependencies; keep Docker export aligned.
constraint-dependencies = ["urllib3>=2.8.0", "oauthlib>=4.0.0"]

[project.scripts]
text2sql-server = "text2sql.api.server:run_server"
text2sql-train  = "text2sql.training.pipeline:train_knowledge"
text2sql-train-retriever = "text2sql.retrieval.train:main"
text2sql-export-schema = "text2sql.cli.export_schema_snapshot:main"
text2sql-evaluate = "text2sql.evaluation.run:main"
text2sql-db-check = "text2sql.infrastructure.database_preflight:main"
text2sql-release-check = "text2sql.release.readiness:main"
text2sql-gold-set = "text2sql.cli.gold_set:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["text2sql*"]

[tool.setuptools.package-data]
text2sql = ["py.typed", "static/*", "templates/*", "build-info.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/text2sql/retrieval/train.py" = ["ASYNC240"]
"src/text2sql/training/pipeline.py" = ["ASYNC240"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
