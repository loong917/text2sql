[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "text2sql"
version = "0.5.0"
description = "Natural Language to SQL via Vanna AI — production-grade service"
requires-python = ">=3.12"
authors = [{ name = "Team" }]
dependencies = [
    "vanna[ollama,chromadb]>=2.0",
    "pyodbc>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "sqlglot>=27.0,<29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
text2sql-server = "src.api.server:run_server"
text2sql-train  = "src.training.pipeline:train_knowledge"
text2sql-train-retriever = "src.retrieval.train:main"
text2sql-migrate-knowledge = "scripts.migrate_markdown_knowledge:main"
text2sql-export-schema = "scripts.export_schema_snapshot:main"
text2sql-evaluate = "src.evaluation.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
